name: Compilar app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund
          pip install pillow

      - name: Generar íconos, fuentes y proyecto Android
        run: |
          python3 scripts/preparar.py web
          npm run android

      - name: Compilar APK (instalable directo)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../salida
          cp app/build/outputs/apk/debug/app-debug.apk ../salida/Control-Asistencia-v${VERSION_CODE}.apk

      - name: Preparar firma para Play Store
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/asistencia.jks"
          echo "ruta=$RUNNER_TEMP/asistencia.jks" >> "$GITHUB_OUTPUT"

      - name: Compilar paquete firmado para Play Store (.aab)
        if: steps.firma.outputs.ruta != ''
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.firma.outputs.ruta }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../salida/Control-Asistencia-PlayStore-v${VERSION_CODE}.aab

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Control-Asistencia-v${{ github.run_number }}
          path: salida/
          retention-days: 30
