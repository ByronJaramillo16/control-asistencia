name: Publicar version web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generar íconos y fuentes
        run: |
          npm install --no-audit --no-fund
          pip install pillow
          python3 scripts/preparar.py web

      - name: Preparar sitio (instalable en iPhone y Android)
        run: |
          mkdir -p sitio
          cp -r www/* sitio/
          cat > sitio/manifest.webmanifest <<'EOF'
          {
            "name": "Control de Asistencia",
            "short_name": "Asistencia",
            "start_url": "./index.html",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#eef3f2",
            "theme_color": "#0f6b66",
            "lang": "es",
            "icons": [
              {"src": "icon-192.png", "sizes": "192x192", "type": "image/png"},
              {"src": "icon-512.png", "sizes": "512x512", "type": "image/png"}
            ]
          }
          EOF
          cat > sitio/sw.js <<'EOF'
          const CACHE = "asistencia-" + "${{ github.run_number }}";
          const FILES = ["./", "./index.html", "./manifest.webmanifest", "./icon-192.png", "./icon-512.png", "./apple-touch-icon.png"];
          self.addEventListener("install", e => { e.waitUntil(caches.open(CACHE).then(c => c.addAll(FILES))); self.skipWaiting(); });
          self.addEventListener("activate", e => { e.waitUntil(caches.keys().then(k => Promise.all(k.filter(x => x !== CACHE).map(x => caches.delete(x))))); self.clients.claim(); });
          self.addEventListener("fetch", e => {
            const u = new URL(e.request.url);
            if (e.request.method !== "GET" || u.origin !== location.origin) return;
            e.respondWith(fetch(e.request).then(r => { const c = r.clone(); caches.open(CACHE).then(x => x.put(e.request, c)); return r; })
              .catch(() => caches.match(e.request).then(r => r || caches.match("./index.html"))));
          });
          EOF
          sed -i 's#<link rel="icon" href="icon-192.png">#<link rel="manifest" href="manifest.webmanifest">\n<link rel="icon" href="icon-192.png">#' sitio/index.html
          grep -c 'rel="manifest"' sitio/index.html
          ls -la sitio

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: deploy
        uses: actions/deploy-pages@v4
